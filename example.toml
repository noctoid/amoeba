# Amoeba catalog — declare virtual SQL tables over files.
#
# Run with:  amoeba example.toml
#
# Each [[tables]] entry maps a logical table name to a source file.
# The backend is inferred from the source extension unless `backend`
# is set explicitly:
#     .csv/.tsv   -> csv
#     .xlsx/.xls  -> xlsx
#     .parquet/.arrow -> parquet
#
# Column `type` values are DuckDB type strings (BIGINT, VARCHAR,
# DECIMAL(10,2), TIMESTAMP, ...). A missing `type` means "infer from the
# source". Explicit types win; inferred types fill the rest.

[[tables]]
name = "users"
source = "data/users.csv"

[[tables.columns]]
name = "id"
type = "BIGINT"

[[tables.columns]]
name = "created_at"
type = "TIMESTAMP"

[[tables]]
name = "orders"
source = "data/orders.parquet"

[[tables]]
name = "metrics"
source = "data/metrics.xlsx"
backend = "xlsx"

[[tables.columns]]
name = "value"
type = "DECIMAL(12,2)"

# --- Complex cases -------------------------------------------------------

# Tab-separated source. `.tsv` maps to the csv backend; `read_csv_auto`
# sniffs the delimiter, so no extra config is needed.
[[tables]]
name = "events_tsv"
source = "data/events.tsv"

# Arrow IPC file (Arrow is Parquet's in-memory format; DuckDB reads both
# via read_parquet). `.arrow` maps to the parquet backend.
[[tables]]
name = "events_arrow"
source = "data/events.arrow"
backend = "parquet"

# A wide table with mixed typing: only the listed columns are cast to the
# declared type; every other column is inferred from the source.
[[tables]]
name = "ledger"
source = "data/ledger.parquet"

[[tables.columns]]
name = "amount"
type = "DECIMAL(18,4)"

[[tables.columns]]
name = "posted_at"
type = "TIMESTAMP WITH TIME ZONE"

[[tables.columns]]
name = "event_id"
type = "UUID"

[[tables.columns]]
name = "active"
type = "BOOLEAN"

[[tables.columns]]
name = "tags"
type = "VARCHAR[]"

[[tables.columns]]
name = "meta"
type = "STRUCT(version INTEGER, origin VARCHAR)"

[[tables.columns]]
name = "attrs"
type = "MAP(VARCHAR, VARCHAR)"

[[tables.columns]]
name = "payload"
type = "JSON"

# --- API backend ---------------------------------------------------------

# A JSON REST endpoint exposed as a table. The adapter GETs the URL,
# extracts the row array at `rows_path` (dotted path, `$` = top-level
# array), and follows pagination until exhausted:
#   none   — one request returns everything (default)
#   offset — sends limit_param/offset_param, pages by page_size until a
#            short page comes back
#   cursor — reads the next token from cursor_path in the response and
#            sends it back as cursor_param until absent
# `max_pages` (default 100) is a hard cap against unbounded pulls.
# `[tables.headers]` carries static auth — bearer tokens, API keys, etc.
# If the API returns no rows, declare column types: there is nothing to
# infer from an empty response.

# [[tables]]
# name = "issues"
# backend = "api"
# source = "https://api.example.com/issues"
# rows_path = "$.items"
# pagination = "offset"
# page_size = 100

# [[tables.columns]]
# name = "id"
# type = "BIGINT"

# [tables.headers]
# Authorization = "Bearer <token>"
