[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amoeba"
version = "0.1.0"
description = "MySQL-protocol-compatible SQL frontend over CSV/XLSX/Parquet/API backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mysql-mimic>=3.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pymysql>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
